<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--page,#F5F7F6);font-family:Montserrat,system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:var(--ink,#0F1417);transition:background .25s,color .25s}
body.dark{--page:#0B0F11;--block:#1A2226;--block2:#222B31;--surface:#161C20;--ink:#F5F7F6;--btn:#F5F7F6;--btnFg:#0F1417;--muted:#9AA5A1;--muted2:#7E8985;--line:#2A343A;--line2:#242D33;--tint:#0F2A25;--tealText:#3DBFA3;--amberTint:#2B2210;--amberText:#E0A63A;--redTint:#2E1714;--redText:#F08A7A;--disabled:#3A454B}
a{color:var(--muted,#6B7573);text-decoration:none}a:hover{color:#029A7C}
input{font-family:Montserrat,system-ui,sans-serif}
@keyframes sw-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sw-pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;gap:28px;padding:28px 24px 48px;box-sizing:border-box;flex-wrap:wrap;align-items:flex-start;justify-content:center">

  <div style="width:236px;flex-shrink:0;display:flex;flex-direction:column;gap:20px;position:sticky;top:28px">
    <div>
      <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><img src="brand/logo-tagline-black.png" alt="Switch — Crypto Exchange" style="width:170px;display:block"></sc-if>
      <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><img src="brand/logo-tagline-white.png" alt="Switch — Crypto Exchange" style="width:170px;display:block"></sc-if>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:18px;font-weight:800;letter-spacing:-.02em">End User App</div><div style="font-size:12px;color:var(--muted,#6B7573);font-weight:500;line-height:1.5">Design only. Tap through the phone, or jump to a screen.</div></div>

    <div style="display:flex;flex-direction:column;gap:7px">
      <div style="font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted,#6B7573)">Platform</div>
      <div style="display:flex;background:var(--block2,#F0F2F1);border-radius:11px;padding:3px;gap:3px">
        <sc-for list="{{ platforms }}" as="p" hint-placeholder-count="3">
          <div onClick="{{ p.pick }}" style="flex:1;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;cursor:pointer;background:{{ p.bg }};color:{{ p.fg }}">{{ p.label }}</div>
        </sc-for>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:7px">
      <div style="font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted,#6B7573)">Appearance</div>
      <div style="display:flex;background:var(--block2,#F0F2F1);border-radius:11px;padding:3px;gap:3px">
        <div onClick="{{ setLight }}" style="flex:1;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:800;cursor:pointer;background:{{ lightBg }};color:{{ lightFg }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</div>
        <div onClick="{{ setDark }}" style="flex:1;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:800;cursor:pointer;background:{{ darkBg }};color:{{ darkFg }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>Dark</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:7px">
      <div style="font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted,#6B7573)">Screens</div>
      <div style="display:flex;flex-direction:column;gap:1px">
        <sc-for list="{{ screens }}" as="s" hint-placeholder-count="8">
          <div style="display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted,#6B7573)">
            <div style="width:18px;height:18px;border-radius:5px;background:var(--block2,#F0F2F1);color:var(--muted,#6B7573);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;flex-shrink:0">{{ s.n }}</div>{{ s.label }}
          </div>
        </sc-for>
      </div>
      <div style="font-size:11px;color:var(--muted,#6B7573);font-weight:500;line-height:1.55;padding:2px 4px">Bottom tabs: Home · Wallets · Orders · Support · Profile. Buy and Sell both run through the Home switcher.</div>
    </div>
  </div>

  <div style="display:flex;gap:28px;flex-wrap:wrap;justify-content:center;align-items:flex-start">
    <sc-if value="{{ showIos }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
          <div style="font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted,#6B7573)">{{ iosLabel }}</div>
          <div style="display:flex;background:var(--block2,#F0F2F1);border-radius:10px;padding:3px;gap:3px">
            <sc-for list="{{ iosModels }}" as="m" hint-placeholder-count="3">
              <div onClick="{{ m.pick }}" style="height:30px;padding:0 11px;border-radius:7px;display:flex;align-items:center;font-size:10px;font-weight:800;cursor:pointer;white-space:nowrap;background:{{ m.bg }};color:{{ m.fg }}">{{ m.label }}</div>
            </sc-for>
          </div>
        </div>
        <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ isDark }}" width="{{ iosW }}" height="{{ iosH }}" hint-size="402px,874px">
          <dc-import name="Switch App Screens" dark="{{ isDark }}" on-toggle-theme="{{ toggleTheme }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import>
        </x-import>
      </div>
    </sc-if>
    <sc-if value="{{ showAndroid }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
        <div style="font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted,#6B7573)">Android</div>
        <x-import component-from-global-scope="AndroidDevice" from="./android-frame.jsx" dark="{{ isDark }}" hint-size="412px,892px">
          <dc-import name="Switch App Screens" dark="{{ isDark }}" on-toggle-theme="{{ toggleTheme }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import>
        </x-import>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;platform&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ios&quot;,&quot;android&quot;,&quot;both&quot;],&quot;default&quot;:&quot;ios&quot;,&quot;tsType&quot;:&quot;'ios'|'android'|'both'&quot;,&quot;section&quot;:&quot;Frame&quot;}}">
class Component extends DCLogic {
  state = { platform:'ios', dark:false, model:'17pro' };
  MODELS = [ {id:'17',label:'iPhone 17',w:402,h:874}, {id:'17pro',label:'iPhone 17 Pro',w:402,h:874}, {id:'17promax',label:'17 Pro Max',w:440,h:956} ];
  componentDidMount(){ let d=false; try{ d=localStorage.getItem('switch-app-theme')==='dark'; }catch(e){} document.body.classList.toggle('dark',d); if(d) this.setState({dark:true}); }
  setTheme(d){ document.body.classList.toggle('dark',d); try{ localStorage.setItem('switch-app-theme',d?'dark':'light'); }catch(e){} this.setState({dark:d}); }
  renderVals(){
    const st=this.state, P=this.props.platform||st.platform, dark=!!st.dark;
    const seg=(on)=>({bg:on?'var(--surface,#fff)':'transparent',fg:on?'var(--ink,#0F1417)':'var(--muted,#6B7573)'});
    return {
      isDark:dark, isLight:!dark,
      platforms:[['ios','iOS'],['android','Android'],['both','Both']].map(([v,label])=>({label,pick:()=>this.setState({platform:v}),...seg(P===v)})),
      showIos:P==='ios'||P==='both', showAndroid:P==='android'||P==='both',
      iosModels:this.MODELS.map(m=>({label:m.label,pick:()=>this.setState({model:m.id}),...seg(m.id===(st.model||'17pro'))})),
      iosLabel:(this.MODELS.find(m=>m.id===(st.model||'17pro'))||this.MODELS[1]).label,
      iosW:(this.MODELS.find(m=>m.id===(st.model||'17pro'))||this.MODELS[1]).w, iosH:(this.MODELS.find(m=>m.id===(st.model||'17pro'))||this.MODELS[1]).h,
      setLight:()=>this.setTheme(false), setDark:()=>this.setTheme(true), toggleTheme:()=>this.setTheme(!dark),
      lightBg:seg(!dark).bg, lightFg:seg(!dark).fg, darkBg:seg(dark).bg, darkFg:seg(dark).fg,
      screens:['Sign in','Forgot password','Home · Buy/Sell switcher','Method + wallet address','Pay (QR, bank, card, cash)','Confirming · 0/19','Orders','Order detail','Profile · levels'].map((label,i)=>({label,n:i+1}))
    };
  }
}
</script>
</body>
</html>
